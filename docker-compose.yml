version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: investment-sentinel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-investment_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investment-sentinel-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-investment_sentinel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sentinel_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret_password}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-SENTINEL}
      SMS_RECIPIENT: ${SMS_RECIPIENT:-+919876543210}
      EARLY_DRAWDOWN_ALERTS: ${EARLY_DRAWDOWN_ALERTS:-true}
      REVIEW_INTERVAL_MONTHS: ${REVIEW_INTERVAL_MONTHS:-3}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
